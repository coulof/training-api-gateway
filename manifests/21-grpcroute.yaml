apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: podinfo-grpc
  namespace: demo
spec:
  parentRefs:
    - name: web
      namespace: infra
      sectionName: web
  hostnames:
    - "grpc.podinfo.lab"
  rules:
    - matches:
        - method:
            service: grpc.health.v1.Health
            method: Check
      backendRefs:
        - name: podinfo-grpc
          port: 9999
