# Troubleshooting: BackendNotFound Error
# Trigger: Route references a non-existent backend Service "missing-service".
# Expected Condition on HTTPRoute:
#   Type: ResolvedRefs, Status: False, Reason: BackendNotFound
#   Message: Service "missing-service" not found
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: err-backend-not-found
  namespace: demo
spec:
  parentRefs:
    - name: web
      namespace: infra
      sectionName: web
  hostnames:
    - "podinfo.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /missing
      backendRefs:
        - name: missing-service
          port: 8080
