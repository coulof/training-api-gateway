# Troubleshooting: NotAllowedByListeners Error
# Trigger: Route in namespace "demo" attempts to attach to Gateway with "from: Same" in namespace "infra".
# Expected Condition on HTTPRoute:
#   Type: Accepted, Status: False, Reason: NotAllowedByListeners
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: err-not-allowed
  namespace: demo
spec:
  parentRefs:
    - name: web
      namespace: infra
      sectionName: web
  hostnames:
    - "podinfo.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podinfo-v1
          port: 9898
