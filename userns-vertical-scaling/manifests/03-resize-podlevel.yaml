# Lab 3: Pod-Level Aggregate Vertical Scaling (Beta in K8s 1.36)
# Aggregate resource budget shared across multiple containers without hand-tuning each container spec.
apiVersion: v1
kind: Pod
metadata:
  name: podlevel-resize-demo
  namespace: userns-lab
  labels:
    app: podlevel-resize-demo
spec:
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "250m"
      memory: "128Mi"
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "yes > /dev/null & sleep 3600"]
  - name: sidecar
    image: busybox:1.36
    command: ["sleep", "3600"]
