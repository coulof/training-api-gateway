apiVersion: v1
kind: Namespace
metadata:
  name: userns-lab
---
# Lab 1a: User Namespaces Baseline Pod
# Kubernetes 1.36 GA: hostUsers: false remaps container UID 0 to an unprivileged host UID.
apiVersion: v1
kind: Pod
metadata:
  name: userns-demo
  namespace: userns-lab
  labels:
    app: userns-demo
spec:
  hostUsers: false
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      runAsUser: 0
