# Lab 1b: User Namespaces HostPath Mount Breakout Verification
# Sandbox nodes only — tests whether container root writing to a hostPath
# volume creates files owned by root (UID 0) or the remapped unprivileged UID on the node.
apiVersion: v1
kind: Pod
metadata:
  name: userns-hostpath-demo
  namespace: userns-lab
  labels:
    app: userns-hostpath-demo
spec:
  hostUsers: false
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sh", "-c", "echo 'pwned via container root' > /host-tmp/from-container.txt; sleep 3600"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: host-tmp
      mountPath: /host-tmp
  volumes:
  - name: host-tmp
    hostPath:
      path: /tmp
